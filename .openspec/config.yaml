schema: spec-driven

context: |
  Tech stack: Astro, Qwik islands (@qwikdev/astro + flowbite-qwik), TinaCMS, Tailwind CSS v4, TypeScript, pnpm
  CMS: TinaCMS headless for content management (blog, pages, programs collections)
  Design System: @cihubs/design-system as workspace dependency, CIHUBS blue palette (#203370)
  Fonts (SSOT: design-system DESIGN.md quad-font): Poppins 700 headlines, Montserrat 400/700 body/CTAs, Work Sans 600 UI, Open Sans 400 content
  UI: Flowbite vanilla (data-attributes + CDN JS), no React, no flowbite-react
  Readability: component vocabulary (src/components/astro/) + semantic @layer classes, no loose utilities in pages
  Build: Astro build system with Vite
  Deployment: Static site hosting

rules:
  proposal:
    - Include rollback plan
    - Identify affected sections
  specs:
    - Use Given/When/Then format for scenarios
  design:
    - Include component diagrams for UI changes
  tasks:
    - Include acceptance criteria
